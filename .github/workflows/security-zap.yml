# Phase 20-F (§5(b)): Automated Security Gates — OWASP ZAP Baseline & API Scan + Gitleaks + Dependency Audit
name: Security Hardening Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  secret-and-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full git history scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --recursive
            .
      - name: npm audit (high/critical gate)
        run: |
          npm --prefix apps/api audit --audit-level=high
          npm --prefix apps/web audit --audit-level=high

  zap-baseline:
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP API Scan (fail on High)
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: ${{ vars.STAGING_API_URL }}/api/v1/health
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-l FAIL'

