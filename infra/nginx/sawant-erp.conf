# Phase 20-F (§5(b), §4.5): Dedicated Nginx reverse-proxy vhost for Sawant Group ERP
# Resolves findings D6 (X-Forwarded-For / TRUST_PROXY) and D12 (dedicated vhost file).

limit_req_zone $binary_remote_addr zone=erp_api_limit:10m rate=20r/s;

upstream sawant_erp_backend {
    server 127.0.0.1:5011 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5012 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    server_name api.sawantgroup.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sawantgroup.example;

    # TLS via certbot — Mozilla Intermediate (TLS 1.2 / 1.3)
    ssl_certificate     /etc/letsencrypt/live/api.sawantgroup.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sawantgroup.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /sawant-erp/api/v1/realtime/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        rewrite ^/sawant-erp/api/(.*)$ /api/$1 break;
        proxy_pass http://sawant_erp_backend;
    }

    location /sawant-erp/api/ {
        limit_req zone=erp_api_limit burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        rewrite ^/sawant-erp/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://sawant_erp_backend;
    }
}

